# Minecraft / mapping / loader
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.10

# Mod
mod_version=0.1.3
maven_group=ru.friends
archives_base_name=custom-jukebox

# Fabric API
fabric_version=0.116.5+1.21.1

# Gradle JVM memory
# Raised because of "Java heap space" during :remapJar - the project ships
# 145 OGG tracks + 145 cover images, which needs more heap than Gradle's
# default (~512MB-1GB) during jar remapping. If you still hit OOM, try
# raising -Xmx further (e.g. 6g/8g) - just don't exceed your machine's RAM.
org.gradle.jvmargs=-Xmx4g

# NOTE:
# These are the latest known-good versions at the time this project was generated.
# If the build fails with a "could not resolve dependency" error, go to
# https://fabricmc.net/develop/ and https://modrinth.com/mod/fabric-api/versions
# and copy the newest version numbers that match Minecraft 1.21.1 into this file.